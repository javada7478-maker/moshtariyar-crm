
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مشتریار</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#1e293b;font-family:Tahoma,Arial}
header{background:#172554;color:white;text-align:center;padding:22px}
main{max-width:850px;margin:20px auto;padding:14px}
.card{background:white;border-radius:14px;padding:17px;margin-bottom:15px;box-shadow:0 2px 10px #0001}
input,button{width:100%;padding:13px;margin:6px 0;border:1px solid #dbe2ea;border-radius:9px;font-size:15px}
button{background:#2563eb;color:white;border:0;cursor:pointer}
.danger{background:#dc2626}
.edit{background:#0f766e}
nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
nav button{flex:1;min-width:95px}
.item{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.actions{display:flex;gap:5px}
.actions button{width:auto;padding:8px 11px}
.hidden{display:none}
.small{font-size:12px;color:#64748b}
</style>
</head>
<body>
<header>
<h2>مشتریار</h2>
<div>مدیریت هوشمند مشتریان و فروش</div>
</header>
<main>

<section id="auth" class="card">
<h3>ورود به مشتریار</h3>
<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز عبور">
<button onclick="signUp()">ثبت‌نام</button>
<button onclick="signIn()">ورود</button>
<p id="authMsg" class="small"></p>
</section>

<section id="app" class="hidden">
<div class="card">
سلام، خوش آمدی
<button onclick="signOut()">خروج از حساب</button>
</div>

<nav>
<button onclick="tab('customers')">مشتریان</button>
<button onclick="tab('sales')">فروش</button>
<button onclick="tab('orders')">سفارش‌ها</button>
<button onclick="tab('expenses')">هزینه‌ها</button>
<button onclick="tab('reports')">گزارش‌ها</button>
</nav>

<div id="customers" class="card">
<h3>مدیریت مشتریان</h3>
<input id="cname" placeholder="نام مشتری">
<input id="cphone" placeholder="شماره تماس">
<button onclick="addCustomer()">ثبت مشتری</button>
<hr>
<h3>جست‌وجوی مشتری</h3>
<input id="searchCustomer" placeholder="نام یا شماره تماس را وارد کن" oninput="renderCustomers()">
<div id="customerList"></div>
</div>

<div id="sales" class="card hidden">
<h3>ثبت فروش</h3>
<input id="sname" placeholder="نام مشتری">
<input id="samount" type="number" placeholder="مبلغ فروش به تومان">
<button onclick="addSale()">ثبت فروش</button>
<div id="salesList"></div>
</div>

<div id="orders" class="card hidden">
<h3>ثبت سفارش</h3>
<input id="oname" placeholder="نام مشتری">
<input id="oamount" type="number" placeholder="مبلغ سفارش به تومان">
<button onclick="addOrder()">ثبت سفارش</button>
<div id="orderList"></div>
</div>

<div id="expenses" class="card hidden">
<h3>ثبت هزینه</h3>
<input id="etitle" placeholder="عنوان هزینه">
<input id="eamount" type="number" placeholder="مبلغ هزینه به تومان">
<button onclick="addExpense()">ثبت هزینه</button>
<div id="expenseList"></div>
</div>

<div id="reports" class="card hidden">
<h3>گزارش مالی</h3>
<p>مجموع فروش: <b id="totalSales">۰</b></p>
<p>مجموع هزینه: <b id="totalExpenses">۰</b></p>
<p>سود خالص: <b id="netProfit">۰</b></p>
<p>تعداد مشتریان: <b id="totalCustomers">۰</b></p>
<p>تعداد سفارش‌ها: <b id="totalOrders">۰</b></p>
</div>

</section>
</main>

<script>
const SUPABASE_URL="https://yvtzzmvemaltpkmeddnk.supabase.co";
const SUPABASE_KEY="sb_publishable_8XGT5VOphwKE82YTAqP4Hg_qI3Mdxbh";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null;
let customers=[],sales=[],orders=[],expenses=[];
const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString("fa-IR")+" تومان";
const msg=t=>$("authMsg").textContent=t;

async function signUp(){
 const email=$("email").value.trim();
 const password=$("password").value;
 if(!email||password.length<6)return msg("ایمیل و رمز حداقل ۶ کاراکتری وارد کن");
 const {data,error}=await db.auth.signUp({email,password});
 if(error)return msg(error.message);
 if(data.session){user=data.user;await showApp()}
 else msg("ثبت‌نام انجام شد؛ ایمیلت را برای تأیید بررسی کن.");
}

async function signIn(){
 const {data,error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });
 if(error)return msg(error.message);
 user=data.user;
 await showApp();
}

async function signOut(){
 await db.auth.signOut();
 user=null;
 $("app").classList.add("hidden");
 $("auth").classList.remove("hidden");
}

async function showApp(){
 $("auth").classList.add("hidden");
 $("app").classList.remove("hidden");
 await loadData();
}

async function loadData(){
 const tables=["customers","sales","orders","expenses"];
 for(const table of tables){
  const {data,error}=await db.from(table).select("*").order("created_at",{ascending:false});
  if(error){alert("خطا در دریافت اطلاعات: "+error.message);return}
  if(table==="customers")customers=data;
  if(table==="sales")sales=data;
  if(table==="orders")orders=data;
  if(table==="expenses")expenses=data;
 }
 render();
}

async function addRow(table,row){
 const {error}=await db.from(table).insert({...row,owner_id:user.id});
 if(error){alert(error.message);return false}
 await loadData();
 return true;
}

async function addCustomer(){
 const name=$("cname").value.trim();
 const phone=$("cphone").value.trim();
 if(!name)return alert("نام مشتری را وارد کن");
 const ok=await addRow("customers",{name,phone});
 if(ok){$("cname").value="";$("cphone").value=""}
}

async function editCustomer(id){
 const c=customers.find(x=>x.id===id);
 if(!c)return;
 const name=prompt("نام جدید:",c.name);
 if(name===null)return;
 if(!name.trim())return alert("نام نمی‌تواند خالی باشد");
 const phone=prompt("شماره تماس جدید:",c.phone||"");
 if(phone===null)return;
 const {error}=await db.from("customers")
  .update({name:name.trim(),phone:phone.trim()}).eq("id",id);
 if(error)return alert(error.message);
 await loadData();
 alert("مشتری ویرایش شد");
}

async function addSale(){
 const customer_name=$("sname").value.trim();
 const amount=Number($("samount").value);
 if(!customer_name||amount<=0)return alert("نام و مبلغ معتبر وارد کن");
 const ok=await addRow("sales",{customer_name,amount});
 if(ok){$("sname").value="";$("samount").value=""}
}

async function addOrder(){
 const customer_name=$("oname").value.trim();
 const amount=Number($("oamount").value);
 if(!customer_name||amount<=0)return alert("نام و مبلغ معتبر وارد کن");
 const ok=await addRow("orders",{customer_name,amount,status:"در انتظار"});
 if(ok){$("oname").value="";$("oamount").value=""}
}

async function addExpense(){
 const title=$("etitle").value.trim();
 const amount=Number($("eamount").value);
 if(!title||amount<=0)return alert("عنوان و مبلغ معتبر وارد کن");
 const ok=await addRow("expenses",{title,amount});
 if(ok){$("etitle").value="";$("eamount").value=""}
}

async function removeRow(table,id){
 if(!confirm("از حذف مطمئنی؟"))return;
 const {error}=await db.from(table).delete().eq("id",id);
 if(error)return alert(error.message);
 await loadData();
}

function renderCustomers(){
 const q=$("searchCustomer").value.trim().toLowerCase();
 const filtered=customers.filter(c=>
  (c.name||"").toLowerCase().includes(q)||
  (c.phone||"").toLowerCase().includes(q)
 );
 $("customerList").innerHTML=filtered.length?filtered.map(c=>`
  <div class="item">
   <span>${esc(c.name)} - ${esc(c.phone||"بدون شماره")}</span>
   <div class="actions">
    <button class="edit" onclick="editCustomer('${c.id}')">ویرایش</button>
    <button class="danger" onclick="removeRow('customers','${c.id}')">حذف</button>
   </div>
  </div>`).join(""):"مشتری پیدا نشد";
}

function render(){
 renderCustomers();

 $("salesList").innerHTML=sales.map(x=>`
 <div class="item"><span>${esc(x.customer_name)} - ${money(x.amount)}</span>
 <button class="danger" style="width:auto" onclick="removeRow('sales','${x.id}')">حذف</button></div>`).join("");

 $("orderList").innerHTML=orders.map(x=>`
 <div class="item"><span>${esc(x.customer_name)} - ${money(x.amount)} (${esc(x.status)})</span>
 <button class="danger" style="width:auto" onclick="removeRow('orders','${x.id}')">حذف</button></div>`).join("");

 $("expenseList").innerHTML=expenses.map(x=>`
 <div class="item"><span>${esc(x.title)} - ${money(x.amount)}</span>
 <button class="danger" style="width:auto" onclick="removeRow('expenses','${x.id}')">حذف</button></div>`).join("");

 const s=sales.reduce((a,x)=>a+Number(x.amount),0);
 const e=expenses.reduce((a,x)=>a+Number(x.amount),0);
 $("totalSales").textContent=money(s);
 $("totalExpenses").textContent=money(e);
 $("netProfit").textContent=money(s-e);
 $("totalCustomers").textContent=customers.length.toLocaleString("fa-IR");
 $("totalOrders").textContent=orders.length.toLocaleString("fa-IR");
}

function tab(id){
 ["customers","sales","orders","expenses","reports"].forEach(x=>
  $(x).classList.toggle("hidden",x!==id)
 );
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

db.auth.onAuthStateChange((event,session)=>{
 if(session?.user){
  user=session.user;
  if($("app").classList.contains("hidden"))showApp();
 }else if(event==="SIGNED_OUT"){
  user=null;
  $("app").classList.add("hidden");
  $("auth").classList.remove("hidden");
 }
});

db.auth.getSession().then(({data})=>{
 if(data.session?.user){
  user=data.session.user;
  showApp();
 }
});
</script>
</body>
</html>

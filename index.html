

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشتریار CRM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:tahoma;color:#172554}
header{background:#172554;color:white;padding:24px}
main{max-width:850px;margin:auto;padding:16px}
.card{background:white;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 3px 12px #ddd}
h1{margin:0 0 8px}
h2{font-size:18px}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit}
button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:white;font-family:inherit;margin:3px}
.delete{background:#dc2626}
.edit{background:#0f766e}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.number{font-size:23px;color:#2563eb;font-weight:bold;margin-top:10px}
.customer{padding:12px 0;border-bottom:1px solid #ddd}
small{color:#64748b}
</style>
</head>
<body>
<header>
<h1>مشتریار CRM</h1>
<p>مدیریت هوشمند مشتریان و فروش</p>
</header>
<main>
<div class="stats">
<div class="card">تعداد مشتریان<div class="number" id="count">۰</div></div>
<div class="card">مجموع فروش<div class="number" id="sales">۰</div></div>
</div>

<div class="card">
<h2>ثبت مشتری جدید</h2>
<input id="name" placeholder="نام مشتری">
<input id="phone" placeholder="شماره تماس">
<button onclick="addCustomer()">ثبت مشتری</button>
</div>

<div class="card">
<h2>ثبت فروش</h2>
<input id="saleName" placeholder="نام مشتری">
<input id="amount" type="number" placeholder="مبلغ فروش به تومان">
<button onclick="addSale()">ثبت فروش</button>
</div>

<div class="card">
<h2>فهرست مشتریان</h2>
<input id="search" placeholder="جست‌وجوی مشتری..." oninput="render()">
<div id="list"></div>
</div>
</main>

<script>
let customers=JSON.parse(localStorage.getItem('crmCustomers')||'[]');
let sales=JSON.parse(localStorage.getItem('crmSales')||'[]');

function safe(s){
return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function save(){
localStorage.setItem('crmCustomers',JSON.stringify(customers));
localStorage.setItem('crmSales',JSON.stringify(sales));
render();
}

function addCustomer(){
let name=document.getElementById('name').value.trim();
let phone=document.getElementById('phone').value.trim();
if(!name||!phone){alert('نام و شماره تماس را وارد کنید');return;}
customers.push({id:Date.now(),name,phone});
document.getElementById('name').value='';
document.getElementById('phone').value='';
save();
}

function editCustomer(id){
let c=customers.find(x=>x.id===id);
if(!c)return;
let name=prompt('نام جدید مشتری:',c.name);
if(name===null)return;
let phone=prompt('شماره تماس جدید:',c.phone);
if(phone===null)return;
if(!name.trim()||!phone.trim()){alert('اطلاعات نمی‌تواند خالی باشد');return;}
c.name=name.trim();
c.phone=phone.trim();
save();
}

function removeCustomer(id){
if(!confirm('این مشتری حذف شود؟'))return;
customers=customers.filter(c=>c.id!==id);
save();
}

function addSale(){
let name=document.getElementById('saleName').value.trim();
let amount=Number(document.getElementById('amount').value);
if(!name||amount<=0){alert('نام و مبلغ معتبر وارد کنید');return;}
sales.push({name,amount});
document.getElementById('saleName').value='';
document.getElementById('amount').value='';
save();
}

function render(){
let q=document.getElementById('search').value.trim().toLowerCase();
document.getElementById('count').textContent=customers.length.toLocaleString('fa-IR');
document.getElementById('sales').textContent=sales.reduce((s,x)=>s+x.amount,0).toLocaleString('fa-IR');
let filtered=customers.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q));
let list=document.getElementById('list');
list.innerHTML='';
if(!filtered.length){
list.textContent='هنوز مشتری ثبت نشده است.';
return;
}
filtered.forEach(c=>{
let div=document.createElement('div');
div.className='customer';
div.innerHTML='<b>'+safe(c.name)+'</b><br><small>'+safe(c.phone)+'</small><br><button class="edit" onclick="editCustomer('+Number(c.id)+')">ویرایش</button><button class="delete" onclick="removeCustomer('+Number(c.id)+')">حذف</button>';
list.appendChild(div);
});
}
render();
</script>
</body>
</html>

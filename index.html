
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشتریار CRM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:tahoma;color:#172554}
header{background:#172554;color:white;padding:24px}
main{max-width:850px;margin:auto;padding:16px}
.card{background:white;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 3px 12px #ddd}
h1{margin:0 0 8px}h2{font-size:18px}
input,select{width:100%;padding:13px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;background:white}
button{padding:11px 15px;border:0;border-radius:8px;background:#2563eb;color:white;font-family:inherit;margin:3px}
.delete{background:#dc2626}.edit{background:#0f766e}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.number{font-size:22px;color:#2563eb;font-weight:bold;margin-top:10px}
.customer,.order{padding:13px 0;border-bottom:1px solid #ddd}
small{color:#64748b}
</style>
</head>
<body>
<header>
<h1>مشتریار CRM</h1>
<p>مدیریت هوشمند مشتریان و فروش</p>
</header>
<main>

<div class="stats">
<div class="card">تعداد مشتریان<div class="number" id="count">۰</div></div>
<div class="card">مجموع فروش<div class="number" id="sales">۰</div></div>
</div>

<div class="card">
<h2>ثبت مشتری جدید</h2>
<input id="name" placeholder="نام مشتری">
<input id="phone" placeholder="شماره تماس">
<button onclick="addCustomer()">ثبت مشتری</button>
</div>

<div class="card">
<h2>ثبت سفارش جدید</h2>
<select id="orderCustomer">
<option value="">انتخاب مشتری</option>
</select>
<input id="orderAmount" type="number" min="1" placeholder="مبلغ سفارش به تومان">
<select id="orderStatus">
<option value="در انتظار">در انتظار</option>
<option value="در حال انجام">در حال انجام</option>
<option value="تکمیل شده">تکمیل شده</option>
</select>
<button onclick="addOrder()">ثبت سفارش</button>
</div>

<div class="card">
<h2>سوابق سفارش‌ها</h2>
<div id="orders"></div>
</div>

<div class="card">
<h2>ثبت فروش مستقیم</h2>
<input id="saleName" placeholder="نام مشتری">
<input id="amount" type="number" min="1" placeholder="مبلغ فروش به تومان">
<button onclick="addSale()">ثبت فروش</button>
</div>

<div class="card">
<h2>فهرست مشتریان</h2>
<input id="search" placeholder="جست‌وجوی مشتری..." oninput="render()">
<div id="list"></div>
</div>

</main>
<script>
let customers=JSON.parse(localStorage.getItem('crmCustomers')||'[]');
let sales=JSON.parse(localStorage.getItem('crmSales')||'[]');
let orders=JSON.parse(localStorage.getItem('crmOrders')||'[]');

function safe(s){
return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function save(){
localStorage.setItem('crmCustomers',JSON.stringify(customers));
localStorage.setItem('crmSales',JSON.stringify(sales));
localStorage.setItem('crmOrders',JSON.stringify(orders));
render();
}

function addCustomer(){
let name=document.getElementById('name').value.trim();
let phone=document.getElementById('phone').value.trim();
if(!name||!phone){alert('نام و شماره تماس را وارد کنید');return;}
customers.push({id:Date.now(),name,phone});
document.getElementById('name').value='';
document.getElementById('phone').value='';
save();
}

function editCustomer(id){
let c=customers.find(x=>x.id===id);
if(!c)return;
let name=prompt('نام جدید:',c.name);
if(name===null)return;
let phone=prompt('شماره تماس جدید:',c.phone);
if(phone===null)return;
if(!name.trim()||!phone.trim()){alert('اطلاعات نمی‌تواند خالی باشد');return;}
c.name=name.trim();c.phone=phone.trim();save();
}

function removeCustomer(id){
if(!confirm('این مشتری حذف شود؟'))return;
customers=customers.filter(c=>c.id!==id);
save();
}

function addSale(){
let name=document.getElementById('saleName').value.trim();
let amount=Number(document.getElementById('amount').value);
if(!name||amount<=0){alert('نام و مبلغ معتبر وارد کنید');return;}
sales.push({name,amount});
document.getElementById('saleName').value='';
document.getElementById('amount').value='';
save();
}

function addOrder(){
let id=Number(document.getElementById('orderCustomer').value);
let customer=customers.find(c=>c.id===id);
let amount=Number(document.getElementById('orderAmount').value);
let status=document.getElementById('orderStatus').value;
if(!customer){alert('ابتدا یک مشتری انتخاب کنید');return;}
if(amount<=0){alert('مبلغ معتبر وارد کنید');return;}
orders.push({
id:Date.now(),
customerId:id,
name:customer.name,
amount:amount,
status:status,
date:new Date().toLocaleDateString('fa-IR')
});
document.getElementById('orderAmount').value='';
save();
alert('سفارش با موفقیت ثبت شد');
}

function changeStatus(id){
let order=orders.find(o=>o.id===id);
if(!order)return;
let statuses=['در انتظار','در حال انجام','تکمیل شده'];
let next=statuses[(statuses.indexOf(order.status)+1)%3];
order.status=next;
save();
}

function removeOrder(id){
if(!confirm('این سفارش حذف شود؟'))return;
orders=orders.filter(o=>o.id!==id);
save();
}

function render(){
let q=document.getElementById('search').value.trim().toLowerCase();
document.getElementById('count').textContent=customers.length.toLocaleString('fa-IR');
let total=sales.reduce((s,x)=>s+x.amount,0)+orders.filter(o=>o.status==='تکمیل شده').reduce((s,o)=>s+o.amount,0);
document.getElementById('sales').textContent=total.toLocaleString('fa-IR');

let select=document.getElementById('orderCustomer');
let previous=select.value;
select.innerHTML='<option value="">انتخاب مشتری</option>';
customers.forEach(c=>{
let option=document.createElement('option');
option.value=c.id;
option.textContent=c.name+' - '+c.phone;
select.appendChild(option);
});
if(customers.some(c=>String(c.id)===previous))select.value=previous;

let filtered=customers.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q));
let list=document.getElementById('list');
list.innerHTML='';
if(!filtered.length){
list.textContent='هنوز مشتری ثبت نشده است.';
}else{
filtered.forEach(c=>{
let div=document.createElement('div');
div.className='customer';
div.innerHTML='<b>'+safe(c.name)+'</b><br><small>'+safe(c.phone)+'</small><br><button class="edit" onclick="editCustomer('+Number(c.id)+')">ویرایش</button><button class="delete" onclick="removeCustomer('+Number(c.id)+')">حذف</button>';
list.appendChild(div);
});
}

let orderList=document.getElementById('orders');
orderList.innerHTML='';
if(!orders.length){
orderList.textContent='هنوز سفارشی ثبت نشده است.';
}else{
orders.slice().reverse().forEach(o=>{
let div=document.createElement('div');
div.className='order';
div.innerHTML='<b>'+safe(o.name)+'</b><br><small>مبلغ: '+Number(o.amount).toLocaleString('fa-IR')+' تومان</small><br><small>تاریخ: '+safe(o.date)+'</small><br><small>وضعیت: '+safe(o.status)+'</small><br><button onclick="changeStatus('+Number(o.id)+')">تغییر وضعیت</button><button class="delete" onclick="removeOrder('+Number(o.id)+')">حذف سفارش</button>';
orderList.appendChild(div);
});
}
}
render();
</script>
</body>
</html>
